services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT}:6379"
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT}:3000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      HOST_ADAPTER: ${HOST_ADAPTER:-codex}
      BAWE_PROJECTS_ROOT: /workspace/bawestudios
    volumes:
      - ./root/bawestudios:/workspace/bawestudios
      - ./logs:/logs
    # host.docker.internal no existe por defecto en Docker Engine nativo de
    # Linux (a diferencia de Docker Desktop) -- lo agrega a mano apuntando
    # al gateway del host. Confirmado en vivo (docs/instalador-vm-diseno-linux.md).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - redis
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend

volumes:
  db_data:
