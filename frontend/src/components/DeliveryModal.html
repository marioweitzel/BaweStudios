<div id="delivery-modal" class="modal-backdrop" hidden role="dialog" aria-modal="true" aria-labelledby="delivery-modal-title">
  <div class="modal-panel delivery-modal-panel">
    <h2 id="delivery-modal-title" class="modal-title">Proyecto listo</h2>
    <p id="delivery-modal-text" class="modal-text"></p>
    <div id="delivery-modal-password" class="delivery-password" hidden></div>
    <div id="delivery-modal-rating" class="delivery-rating" hidden>
      <span>Valoracion</span>
      <button type="button" data-rating="1">1</button>
      <button type="button" data-rating="2">2</button>
      <button type="button" data-rating="3">3</button>
      <button type="button" data-rating="4">4</button>
      <button type="button" data-rating="5">5</button>
    </div>
    <div id="delivery-modal-actions" class="modal-actions"></div>
  </div>
</div>
