<div id="preview-modal" class="preview-backdrop" hidden role="dialog" aria-modal="true" aria-labelledby="preview-modal-title">
  <div class="preview-shell">
    <div class="preview-toolbar">
      <div>
        <h2 id="preview-modal-title">Vista previa</h2>
        <span id="preview-modal-url"></span>
      </div>
      <div class="preview-actions">
        <button type="button" id="preview-open-tab">Abrir</button>
        <button type="button" id="preview-edit">Editar</button>
        <button type="button" id="preview-close">Cerrar</button>
      </div>
    </div>
    <iframe id="preview-frame" title="Vista previa del proyecto"></iframe>
  </div>
</div>
