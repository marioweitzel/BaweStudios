<!-- ===== DASHBOARD (autenticado) ===== -->
<div id="app-dashboard">
<div class="app-layout">
  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Menu principal">
    <div class="sb-brand" id="sidebar-toggle">
      <div class="sb-brand-ico"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg></div>
      <span class="sb-brand-txt">Bawe<span class="bl">Studio</span></span>
    </div>
    <nav class="sb-nav">
      <button class="nav-btn active" id="nav-home">
        <span class="nav-ico"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg></span>
        <span class="nav-lbl">Inicio</span><span class="nav-tip">Inicio</span>
      </button>
      <button class="nav-btn" id="nav-chat">
        <span class="nav-ico"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
        <span class="nav-lbl">Nuevo Proyecto</span><span class="nav-tip">Nuevo Proyecto</span>
      </button>
      <button class="nav-btn" id="nav-projects">
        <span class="nav-ico"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span>
        <span class="nav-lbl">Proyectos</span><span class="nav-tip">Proyectos</span>
      </button>
    </nav>
    <div class="sb-footer">
      <div class="u-info">
        <div class="u-avatar" id="user-avatar">U</div>
        <div class="u-details"><div class="u-name" id="user-name-disp">Usuario</div><div class="u-email" id="user-email-disp">email</div></div>
      </div>
      <button class="btn-logout" id="logoutBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span class="lo-lbl">Cerrar sesión</span>
      </button>
    </div>
  </aside>
  <div class="main-area" id="main-area">

    {{HOME_VIEW}}
    {{PROJECTS_VIEW}}
    {{CHAT_VIEW}}
  </div><!-- /main-area -->
</div><!-- /app-layout -->
</div><!-- /app-dashboard -->
