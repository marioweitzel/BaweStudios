    <!-- CHAT VIEW -->
    <div class="d-view" id="view-chat">
      <div class="chat-layout">
        <div class="ch-hist">
          <div class="ch-hist-hdr"><button class="btn-new-ch" id="btn-new-chat"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Nuevo Proyecto</button></div>
          <div class="ch-hist-list"><div class="hist-sec-lbl">Historial de proyectos</div><div id="chat-hist-items"><div style="font-size:.75rem;color:#6b7280;padding:12px 8px;text-align:center;font-style:italic">Sin proyectos creados</div></div></div>
        </div>
        <div class="ch-main">
          <div class="ch-star-decor" aria-hidden="true">
            <div class="ch-star-base"></div>
            <div class="ch-star-beam"></div>
          </div>
          <div class="ch-hdr">
            <div>
              <div class="ch-title"><span id="chat-proj-name">Nueva sesión de Diseño ADN</span></div>
              <div class="ch-sub" id="chat-proj-sub">Entrevista no iniciada</div>
            </div>
          </div>
          <div class="chat-msgs" id="chatMessages" aria-live="polite" aria-label="Mensajes del chat">
            <div class="ch-empty" id="chat-empty">
              
              <h3>Iniciá tu nuevo proyecto web</h3>
              <p>Escribí <code>"comenzar"</code> para iniciar el ADN de tu nuevo proyecto o seleccioná uno del historial.</p>
            </div>
          </div>
          <div class="ch-inp"><label for="chatInput" style="position:absolute;left:-9999px">Mensaje</label><input id="chatLogoInput" type="file" accept="image/*" style="display:none"/><button id="chatAttachBtn" class="btn-attach" type="button" aria-label="Adjuntar logo">+</button><textarea id="chatInput" class="ch-ta" rows="1" placeholder="Describí tu proyecto..." aria-label="Escribí tu mensaje"></textarea><button id="chatSendBtn" class="btn-send" type="button"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button></div>
        </div>
      </div>
    </div>
