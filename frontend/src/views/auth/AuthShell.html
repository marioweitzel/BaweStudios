<!-- ===== LANDING (no autenticado) ===== -->
<div id="app-landing">
<header class="l-header">
  <div class="logo-wrap">
    <div class="logo-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg></div>
    <div>
      <div class="logo-text">Bawe<span class="bl">Studio</span></div>
    </div>
  </div>
</header>
<main class="l-main" id="main">
  <div class="l-hero">
    <h1>Tu asistente para crear <span class="gradient-blue">sitios web</span>.</h1>
  </div>
  <div>
    <div class="auth-card">
      <div id="auth-msg" class="a-msg" role="alert" aria-live="polite"></div>
      <form id="form-login" novalidate>
        <label class="form-lbl" for="login-email">Email</label>
        <div class="inp-wrap"><div class="inp-ico"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div><input id="login-email" class="f-input" type="email" autocomplete="email" aria-required="true" placeholder="tu@email.com"/></div>
        <label class="form-lbl" for="login-password">Contrase&ntilde;a</label>
        <div class="inp-wrap has-toggle"><div class="inp-ico"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div><input id="login-password" class="f-input" type="password" autocomplete="current-password" aria-required="true" placeholder="Min 8 caracteres"/><button class="btn-pass-toggle" type="button" data-password-toggle="login-password" aria-label="Mostrar contrase&ntilde;a"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        <button type="submit" class="btn-submit">Iniciar sesi&oacute;n <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
      </form>
      <form id="form-register" novalidate style="display:none">
        <label class="form-lbl" for="reg-name">Nombre completo</label>
        <div class="inp-wrap"><input id="reg-name" class="f-input no-ico" type="text" autocomplete="name" placeholder="Juan P&eacute;rez"/></div>
        <label class="form-lbl" for="reg-email">Email</label>
        <div class="inp-wrap"><div class="inp-ico"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div><input id="reg-email" class="f-input" type="email" autocomplete="email" aria-required="true" placeholder="tu@email.com"/></div>
        <label class="form-lbl" for="reg-password">Contrase&ntilde;a</label>
        <div class="inp-wrap has-toggle"><div class="inp-ico"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div><input id="reg-password" class="f-input" type="password" autocomplete="new-password" aria-required="true" placeholder="Min 8 caracteres"/><button class="btn-pass-toggle" type="button" data-password-toggle="reg-password" aria-label="Mostrar contrase&ntilde;a"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        <button type="submit" class="btn-submit">Confirmar registro <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
      </form>
      <p class="auth-toggle"><a id="auth-switch">Registrarse</a></p>
    </div>
  </div>
</main>
</div>
