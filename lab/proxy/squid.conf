# Unico camino a internet del laboratorio: solo los proveedores de las CLI.
http_port 3128
acl proveedores dstdomain .anthropic.com .claude.ai .openai.com .chatgpt.com
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access allow CONNECT proveedores SSL_ports
http_access allow proveedores
http_access deny all
access_log stdio:/dev/stdout
cache deny all
