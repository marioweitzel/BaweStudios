version: "3.8"

secrets:
  db_password_bs:
    external: true
  db_root_password_bs:
    external: true

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - source: db_password_bs
        target: db_password
      - source: db_root_password_bs
        target: db_root_password
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT}:6379"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  backend:
    image: bawestudioslinux-backend:latest
    ports:
      - "${BACKEND_PORT}:3000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS_FILE: /run/secrets/db_password
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      HOST_ADAPTER: ${HOST_ADAPTER:-codex}
      BAWE_PROJECTS_ROOT: /workspace/bawestudios
      BAWE_TOPOLOGY: ${BAWE_TOPOLOGY:-local}
      BAWE_PUBLIC_BASE_URL: ${BAWE_PUBLIC_BASE_URL:-}
    secrets:
      - source: db_password_bs
        target: db_password
    volumes:
      - ./root/bawestudios:/workspace/bawestudios
      - ./logs:/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  frontend:
    image: bawestudioslinux-frontend:latest
    ports:
      - "${FRONTEND_PORT}:80"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  db_data:
